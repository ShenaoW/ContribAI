[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awi-contribai"
version = "0.1.0"
description = "Standalone AWI disclosure issue and fix PR automation for GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Security PRIDE Research Group" }]
keywords = ["github-actions", "security", "prompt-injection", "awi", "responsible-disclosure"]
dependencies = [
    "aiosqlite>=0.19,<1.0",
    "click>=8.1,<9.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<15.0",
]

[project.optional-dependencies]
openai = ["openai>=1.10,<3.0"]
gemini = ["google-genai>=1.0,<2.0"]
anthropic = ["anthropic>=0.40,<1.0"]
all = [
    "openai>=1.10,<3.0",
    "google-genai>=1.0,<2.0",
    "anthropic>=0.40,<1.0",
]
dev = ["pytest>=8.0,<10.0", "ruff>=0.3,<1.0"]

[project.scripts]
awi-contribai = "awi_contribai.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["awi_contribai"]

[tool.ruff]
target-version = "py311"
line-length = 100
